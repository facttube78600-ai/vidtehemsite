<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="VidTheme — browse videos by category. Latest videos, tag pages and a clean video player." />
    <link rel="icon" href="data:," />
    <title>VidTheme</title>
    <style>
      :root {
        --page-bg: #e9e9e9;       /* light grey page background (sampled from reference) */
        --header-bg: #212121;     /* header bar behind the logo (sampled from reference logo) */
        --bar-bg: #000000;        /* heading bars + footer: pure black (sampled from reference footer) */
        --bar-text: #ffffff;
        --accent: #ec008c;        /* magenta / pink: Search + play buttons */
        --accent-dark: #c40074;
        --strip-bg: #82b5b3;      /* card title strip teal (sampled from reference card strip) */
        --strip-text: #222426;    /* near-black text on the strip (sampled) */
        --page-blue: #0b5ed7;     /* pagination blue: active page fill */
        --card-bg: #ffffff;
        --body-text: #1a1a1a;
        --muted-text: #555555;
        --content-w: 1182px;
      }

      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--body-text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        /* No bottom padding on desktop: the share strip is mobile-only. */
      }
      a { color: var(--page-blue); }
      img { display: block; max-width: 100%; }

      .wrap { max-width: var(--content-w); margin: 0 auto; padding: 0 10px; }

      /* ---------- Header ---------- */
      .site-header { background: var(--header-bg); }
      .site-header .wrap {
        display: flex; align-items: center; gap: 16px;
        padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap;
      }
      /* Logo: plain bold white text on the dark header, far left —
         one colour only, no icon, no coloured part (reference style). */
      .logo {
        color: #fff; text-decoration: none; font-weight: bold;
        font-size: 20px; letter-spacing: .5px; line-height: 1; white-space: nowrap;
      }
      .search-form {
        margin-left: auto; display: flex; gap: 0; flex: 0 1 460px; min-width: 240px;
      }
      .search-form input {
        flex: 1; min-width: 0; border: 0; padding: 10px 12px;
        font-size: 15px; font-family: inherit; background: #fff; color: #111;
        border-radius: 3px 0 0 3px;
      }
      .search-form input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
      .search-form button {
        border: 0; cursor: pointer; padding: 10px 22px;
        background: var(--accent); color: #fff; font-weight: bold;
        font-size: 15px; font-family: inherit; border-radius: 0 3px 3px 0;
      }
      .search-form button:hover { background: var(--accent-dark); }

      /* ---------- Brand row ---------- */
      .brand-row { padding: 10px 0 2px; }
      .brand-row ul {
        list-style: none; margin: 0; padding: 0;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
      }
      /* Brand row: COLOURED TEXT BUTTONS (not images), ~95x50, vertical
         gradient, white bold uppercase centred text, 4px gaps. */
      .brand-row a {
        display: flex; align-items: center; justify-content: center;
        width: 95px; height: 50px; color: #fff; text-decoration: none;
        font-weight: bold; font-size: 12px; line-height: 1.2; text-align: center;
        text-transform: uppercase; padding: 0 4px;
      }
      .brand-row a:hover { opacity: .85; }
      .brand-row a.active { box-shadow: inset 0 0 0 2px #fff; }
      .brand-nature { background: linear-gradient(#2eac6b, #1d7a4d); }
      .brand-travel { background: linear-gradient(#4a8fe0, #2563b8); }
      .brand-food { background: linear-gradient(#e07f3e, #b85e22); }
      .brand-ocean-life { background: linear-gradient(#2ab3bf, #177e88); }
      .brand-mountains { background: linear-gradient(#7f6fb5, #574a85); }
      .brand-city-life { background: linear-gradient(#4a5563, #2e343f); }
      .brand-winter { background: linear-gradient(#74a8c6, #4a7a98); }
      .brand-sky { background: linear-gradient(#b64fa2, #822f70); }

      /* ---------- Ad slots (empty placeholders) ---------- */
      .ad-slot {
        margin: 7px auto; background: #f5f5f5; border: 1px dashed #b5b5b5;
        color: #8a8a8a; display: flex; align-items: center; justify-content: center;
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      }
      .ad-slot.wide { width: 300px; max-width: 92vw; height: 100px; }
      .ad-slot.rect { width: 300px; max-width: 92vw; height: 250px; }

      /* ---------- Heading bars ---------- */
      .heading-bar { background: var(--bar-bg); margin: 12px 0 14px; }
      .heading-bar h1, .heading-bar h2 {
        margin: 0; color: var(--bar-text); font-size: 21px; font-weight: bold;
        text-align: center; padding: 10px 12px; line-height: 1.3;
      }
      .heading-bar.left h1, .heading-bar.left h2 { text-align: left; }

      /* ---------- Pagination ---------- */
      .pagination {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
        margin: 12px 0;
      }
      .pagination a, .pagination span {
        display: inline-block; min-width: 30px; text-align: center;
        padding: 4px 8px; background: #fff; color: var(--page-blue);
        border: 1px solid var(--page-blue); text-decoration: none;
        font-weight: normal; font-size: 13px; line-height: 1.4; border-radius: 2px;
      }
      .pagination a:hover { background: #dcebfd; }
      .pagination .current { background: var(--page-blue); color: #fff; border-color: var(--page-blue); }
      .pagination .dots { background: transparent; border-color: transparent; color: #333; min-width: 0; padding-left: 2px; padding-right: 2px; }
      .pagination .disabled { background: #f0f0f0; color: #a8a8a8; border-color: #c8c8c8; }

      /* ---------- Video grid / cards ---------- */
      .grid {
        display: grid; gap: 8px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      @media (max-width: 1020px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 640px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

      /* Reference card structure: .thumb_wrap > a.thumb_link (image +
         timer only) + sibling .thumb_title strip OUTSIDE the link. */
      .thumb_wrap { min-width: 0; background: var(--card-bg); border: 1px solid #d4d4d4; }
      .thumb_link { display: block; text-decoration: none; }
      .thumb_img { display: block; position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
      .thumb_img img { width: 100%; height: 100%; object-fit: cover; }
      .timer {
        position: absolute; right: 5px; bottom: 5px;
        background: rgba(0, 0, 0, .75); color: #fff;
        font-size: 12px; font-weight: bold; padding: 1px 6px; border-radius: 2px;
      }
      .thumb_title {
        display: block;
        background: var(--strip-bg); color: var(--strip-text);
        font-weight: bold; font-size: 14px; padding: 7px 9px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .empty-note {
        background: #fff; border: 1px solid #d4d4d4; padding: 26px 16px;
        text-align: center; color: var(--muted-text); font-size: 16px;
      }

      /* ---------- Video page ---------- */
      /* Title bar above the player: content-column width only (NOT
         full-viewport), 47px tall, #212121, white bold left text. */
      .video-title-bar {
        background: #212121; height: 47px;
        display: flex; align-items: center;
        margin: 0 0 2px;
      }
      .video-title-bar h1 {
        margin: 0; color: #fff; font-size: 19px; font-weight: bold;
        line-height: 1.2; padding-left: 10px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* Player markup is the classic embed structure:
         .player > .embed-responsive.embed-responsive-16by9
         ("Loading Video..." text + iframe.embed-responsive-item inside) */
      .player { background: #151616; padding: 4px; margin: 0 0 2px; }
      .embed-responsive {
        position: relative; display: flex; width: 100%;
        align-items: center; justify-content: center;
        overflow: hidden; background: #151616; color: #fff;
        font-size: 19px; font-weight: bold; letter-spacing: .5px;
        text-align: center; padding: 0;
      }
      .embed-responsive-16by9 { aspect-ratio: 16 / 9; }
      .embed-responsive .embed-responsive-item {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; border: 0; background: #151616;
      }
      /* Tags directly below the player: NO "Tags:" label. A dark
         #212121 strip across the full column, holding small boxed
         (square-corner) links: #40403d fill, white regular text. */
      .video-tags {
        background: #212121; margin: 0 0 14px; padding: 6px 8px;
        display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      }
      .video-tags a {
        display: inline-flex; align-items: center; height: 22px;
        padding: 0 8px; background: #40403d; color: #fff;
        font-size: 12px; font-weight: normal; text-decoration: none;
        border: 1px solid #b5b5b5; border-radius: 0; white-space: nowrap;
      }
      .video-tags a:hover { background: #55554f; }

      /* Related Videos heading: NOT a full-width black bar. A small
         magenta label box (113 x 25) with a 1px line in the same
         colour spanning the full column, aligned with the label's
         bottom edge (the line is the row directly below it). */
      .related-heading { margin: 18px 0 14px; }
      .related-heading .related-label {
        display: inline-flex; align-items: center;
        width: 113px; height: 25px; padding-left: 10px;
        background: #ad1457; color: #fff;
        font-size: 13px; font-weight: bold; line-height: 1;
      }
      .related-heading .related-line { height: 1px; background: #ad1457; }

      /* "Show more related videos" — a LINK button to the tag page, not
         a JS load-more: background #0088cc, radius 5px, white bold 14px. */
      .loadbtn { text-align: center; margin: 18px 0 6px; }
      .button {
        background-color: #0088cc; border: none; border-radius: 5px;
        color: #fff; padding: 4px 16px; text-align: center; text-decoration: none;
        display: inline-block; font-size: 14px; margin: 4px 2px; cursor: pointer;
        font-family: verdana, sans-serif; font-weight: bold;
      }
      .btn { background-color: #0088cc; color: #fff; border: 2px solid #D0D3D4; }
      .button a { color: #fff; text-decoration: none; }

      /* ---------- Info pages ---------- */
      .info-box { background: #fff; border: 1px solid #d4d4d4; padding: 20px 22px; margin-bottom: 18px; }
      .info-box p { margin: 0 0 12px; }
      .info-box p:last-child { margin-bottom: 0; }

      /* ---------- Footer ---------- */
      .site-footer { background: var(--bar-bg); margin-top: 22px; }
      .site-footer .wrap { padding-top: 18px; padding-bottom: 18px; text-align: center; color: #fff; font-size: 15px; }
      .site-footer a { color: #fff; text-decoration: none; margin: 0 4px; }
      .site-footer a:hover { text-decoration: underline; color: #fff; }
      .site-footer .links { margin-top: 8px; }

      /* ---------- Share strip (fixed bottom, MOBILE ONLY) ---------- */
      /* Hidden on desktop; shown only at max-width 640px. No left
         floating share rail. Share links only — no pop-ups or ads. */
      .share-strip { display: none; }
      .share-strip a, .share-strip button {
        flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 13px; font-weight: bold; text-decoration: none;
        border: 0; cursor: pointer; font-family: inherit; padding: 0 4px;
        white-space: nowrap; overflow: hidden;
      }
      .share-x { background: #000000; }
      .share-wa { background: #25d366; }
      .share-reddit { background: #ff4500; }
      .share-msg { background: #0084ff; }
      .share-tg { background: #229ed9; }
      .share-more { background: #7f8c8d; }
      .share-strip a:hover, .share-strip button:hover { opacity: .85; }
      @media (max-width: 640px) {
        .share-strip {
          position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
          display: flex; height: 40px;
        }
        .share-strip a, .share-strip button { font-size: 11px; }
        body { padding-bottom: 40px; } /* room for the strip on phones */
      }

      @media (max-width: 640px) {
        .logo { font-size: 20px; }
        .search-form { flex: 1 1 100%; margin-left: 0; }
        .heading-bar h1, .heading-bar h2 { font-size: 18px; }
        /* Pagination stays on one line on phones: slightly smaller
           boxes so numbers fit without wrapping or overflow. */
        .pagination { gap: 3px; }
        .pagination a, .pagination span { min-width: 26px; padding: 3px 5px; font-size: 12px; }
        .pagination .dots { padding-left: 0; padding-right: 0; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/">VidTheme</a>
        <form class="search-form" id="searchForm" role="search">
          <input type="search" id="searchInput" placeholder="Search..." aria-label="Search videos" minlength="3" maxlength="60" required />
          <button type="submit">Search</button>
        </form>
      </div>
    </header>

    <nav class="brand-row" aria-label="Categories">
      <div class="wrap">
        <ul id="brandRow"></ul>
      </div>
    </nav>

    <main id="app"></main>

    <footer class="site-footer">
      <div class="wrap">
        <div>&copy; 2026 VidTheme. All rights reserved.</div>
        <div class="links">
          <a href="/terms">Terms of Use</a> -
          <a href="/privacy">Privacy Policy</a> -
          <a href="/contact">Contact Us</a> -
          <a href="/dmca">DMCA</a>
        </div>
      </div>
    </footer>

    <!-- Fixed bottom share strip: 6 coloured segments sharing the current page -->
    <nav class="share-strip" aria-label="Share this page">
      <a class="share-x" data-share="x" href="#" target="_blank" rel="noopener" aria-label="Share on X">X</a>
      <a class="share-wa" data-share="wa" href="#" target="_blank" rel="noopener" aria-label="Share on WhatsApp">WhatsApp</a>
      <a class="share-reddit" data-share="reddit" href="#" target="_blank" rel="noopener" aria-label="Share on Reddit">Reddit</a>
      <a class="share-msg" data-share="msg" href="#" target="_blank" rel="noopener" aria-label="Share on Messenger">Messenger</a>
      <a class="share-tg" data-share="tg" href="#" target="_blank" rel="noopener" aria-label="Share on Telegram">Telegram</a>
      <button class="share-more" data-share="more" type="button" aria-label="Share this page">Share</button>
    </nav>

    <script src="assets/app.js"></script>
  </body>
</html>
